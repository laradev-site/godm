name: "godm"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "net"
priority: "extra"
maintainer: "Laradev <support@laradev.com>"
description: "High-Performance Multi-Connection Download Accelerator"
vendor: "Laradev"
homepage: "https://github.com/laradev/godm"
license: "MIT"
release: "1"

contents:
  - src: "./bin/godm"
    dst: "/usr/local/bin/godm"
  - src: "./bin/godm-cli"
    dst: "/usr/local/bin/godm-cli"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/godm.png"
  - src: "./build/linux/godm.desktop"
    dst: "/usr/share/applications/godm.desktop"
  - src: "./extension"
    dst: "/usr/share/godm/extension"

depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

overrides:
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
