<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="45%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Border Specular Gradient -->
    <linearGradient id="border-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="40%" stop-color="rgba(0, 242, 254, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neon-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#00D2FF" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00FF87" flood-opacity="0.35" />
    </filter>

    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>

    <!-- Speed Stream Gradients -->
    <linearGradient id="stream-left" x1="170" y1="90" x2="220" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0072FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#00C6FF" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <linearGradient id="stream-center" x1="256" y1="80" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38EF7D" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#00F2FE" />
      <stop offset="70%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <linearGradient id="stream-right" x1="340" y1="90" x2="290" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#E100FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Main Supersonic Arrow Head Gradient -->
    <linearGradient id="arrow-grad" x1="130" y1="230" x2="382" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#00FF87" />
    </linearGradient>

    <!-- Arrow Bevel/Facet Accent -->
    <linearGradient id="arrow-facet" x1="256" y1="230" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0055FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Segment / Tray Gradient -->
    <linearGradient id="tray-grad" x1="120" y1="410" x2="392" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.1" />
      <stop offset="20%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#00FF87" />
      <stop offset="80%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />
  <rect x="2" y="2" width="508" height="508" rx="114" stroke="url(#border-grad)" stroke-width="2.5" fill="none" />

  <!-- Ambient Light Sphere Behind Logo -->
  <circle cx="256" cy="245" r="130" fill="#0080FF" opacity="0.35" filter="url(#ambient-glow)" />
  <circle cx="256" cy="300" r="90" fill="#00FF87" opacity="0.25" filter="url(#ambient-glow)" />

  <!-- Multi-Thread Concurrency Grid Accents (Subtle background tracks) -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="180" y1="60" x2="180" y2="240" />
    <line x1="220" y1="60" x2="220" y2="240" />
    <line x1="256" y1="50" x2="256" y2="240" />
    <line x1="292" y1="60" x2="292" y2="240" />
    <line x1="332" y1="60" x2="332" y2="240" />
  </g>

  <!-- THE TURBO MARK -->
  <g filter="url(#neon-glow)">
    <!-- Stream 1 (Left Multi-Thread Beam) -->
    <path d="M182 105C182 105 180 180 196 225L216 220C202 180 204 110 204 105Z" fill="url(#stream-left)" />
    
    <!-- Stream 2 (Right Multi-Thread Beam) -->
    <path d="M330 105C330 105 332 180 316 225L296 220C310 180 308 110 308 105Z" fill="url(#stream-right)" />

    <!-- Center Accelerated Shaft -->
    <path d="M242 85L270 85L270 240L242 240Z" fill="url(#stream-center)" rx="4" />
    
    <!-- Lightning Turbo Chevrons (Upper speed indicators) -->
    <polygon points="256,125 272,95 248,145 264,145 244,185 268,155 252,155" fill="#FFFFFF" opacity="0.9" />

    <!-- Main Supersonic Arrow (Wings + Diamond Spear Head) -->
    <!-- Left Wing -->
    <path d="M128 250L256 376L256 312L178 238L138 240C132 241 126 245 128 250Z" fill="url(#arrow-grad)" />

    <!-- Right Wing & Facet -->
    <path d="M384 250L256 376L256 312L334 238L374 240C380 241 386 245 384 250Z" fill="url(#arrow-facet)" />

    <!-- Center Arrow Ridge Specular Highlight -->
    <path d="M256 220L258 372L254 372L254 220Z" fill="#FFFFFF" opacity="0.8" />
    <circle cx="256" cy="374" r="3.5" fill="#FFFFFF" />

    <!-- Bottom High-Speed Segmented Receiving Dock / Concurrency Meter -->
    <!-- Segment Bar 1 (Left outer) -->
    <rect x="130" y="416" width="38" height="8" rx="4" fill="#00C6FF" opacity="0.7" />
    <!-- Segment Bar 2 -->
    <rect x="178" y="416" width="38" height="8" rx="4" fill="#00E5FF" opacity="0.85" />
    <!-- Segment Bar 3 (Center left) -->
    <rect x="226" y="416" width="26" height="8" rx="4" fill="#00FF87" />
    <!-- Segment Bar 4 (Center right) -->
    <rect x="260" y="416" width="26" height="8" rx="4" fill="#00FF87" />
    <!-- Segment Bar 5 -->
    <rect x="296" y="416" width="38" height="8" rx="4" fill="#00E5FF" opacity="0.85" />
    <!-- Segment Bar 6 (Right outer) -->
    <rect x="344" y="416" width="38" height="8" rx="4" fill="#00C6FF" opacity="0.7" />

    <!-- Speed Pulse Dots below segments -->
    <circle cx="149" cy="436" r="2.5" fill="#00C6FF" opacity="0.5" />
    <circle cx="197" cy="436" r="3" fill="#00E5FF" opacity="0.7" />
    <circle cx="247" cy="436" r="3.5" fill="#00FF87" />
    <circle cx="265" cy="436" r="3.5" fill="#00FF87" />
    <circle cx="315" cy="436" r="3" fill="#00E5FF" opacity="0.7" />
    <circle cx="363" cy="436" r="2.5" fill="#00C6FF" opacity="0.5" />
  </g>
</svg>
