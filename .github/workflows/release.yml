name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  WAILS_VERSION: v3.0.0-beta.26

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    name: Build Windows (amd64)
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: ver
        run: |
          base=$(tr -d '\r\n' < version.txt)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
            tag="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${base}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "Building godm Windows release $tag"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: |
          wails3 build
          go build -trimpath -ldflags="-w -s" -o bin/godm-cli.exe ./cmd/godm

      - name: Fetch Tools for Packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "tools" -Force | Out-Null
          if (-not (Test-Path "tools/yt-dlp.exe")) {
            Write-Host "Downloading yt-dlp.exe..."
            Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"
          }
          if (-not (Test-Path "tools/ffmpeg.exe")) {
            Write-Host "Downloading ffmpeg.exe..."
            Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile "ffmpeg.zip"
            Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
            $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
            if ($ffmpegExe) {
              Copy-Item $ffmpegExe.FullName -Destination "tools/ffmpeg.exe"
            }
            Remove-Item "ffmpeg.zip", "ffmpeg_extracted" -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Setup NSIS
        shell: pwsh
        run: |
          if (Get-Command makensis -ErrorAction SilentlyContinue) {
            Write-Host "makensis is already in PATH"
          } elseif (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            Write-Host "Adding C:\Program Files (x86)\NSIS to PATH"
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "Installing NSIS via choco..."
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: Build Windows Installer
        shell: pwsh
        run: |
          $ver = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"
          
          $makensis = "makensis"
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
              $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
            } elseif (Test-Path "C:\ProgramData\chocolatey\bin\makensis.exe") {
              $makensis = "C:\ProgramData\chocolatey\bin\makensis.exe"
            }
          }

          $binPath = (Resolve-Path "bin/godm.exe").Path
          
          if (-not (Test-Path "build/windows/nsis/MicrosoftEdgeWebview2Setup.exe")) {
            Write-Host "Fetching WebView2 bootstrapper..."
            curl.exe -sSL "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -o "build/windows/nsis/MicrosoftEdgeWebview2Setup.exe"
          }

          cd build/windows/nsis
          Write-Host "Compiling NSIS installer with $makensis for $binPath..."
          & $makensis "-DINFO_PRODUCTVERSION=$ver" "-DARG_WAILS_AMD64_BINARY=$binPath" "project.nsi"
          cd ../../..

      - name: Package Windows Assets
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $zipName = "godm-$tag-windows-amd64.zip"
          
          New-Item -ItemType Directory -Path "dist_win", "artifacts" -Force | Out-Null
          Copy-Item "bin/godm.exe" "dist_win/"
          Copy-Item "bin/godm-cli.exe" "dist_win/"
          if (Test-Path "tools") { Copy-Item "tools" "dist_win/tools" -Recurse }
          Copy-Item "extension" "dist_win/extension" -Recurse
          if (Test-Path "godm-chrome-extension.zip") { Copy-Item "godm-chrome-extension.zip" "dist_win/" }
          if (Test-Path "README.md") { Copy-Item "README.md" "dist_win/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist_win/" }
          
          Compress-Archive -Path "dist_win/*" -DestinationPath "artifacts/$zipName" -Force
          Copy-Item "artifacts/$zipName" "artifacts/godm-windows-amd64.zip"
          Copy-Item "bin/godm.exe" "artifacts/"
          Copy-Item "bin/godm-cli.exe" "artifacts/"

          # Copy NSIS installer into artifacts
          $inst = Get-ChildItem -Path "bin" -Filter "*installer*.exe" | Select-Object -First 1
          if ($inst) {
            Copy-Item $inst.FullName "artifacts/godm-$tag-windows-installer.exe"
            Copy-Item $inst.FullName "artifacts/godm-setup.exe"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: artifacts/*

  build-linux:
    name: Build Linux (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version
        id: ver
        run: |
          base=$(tr -d '\r\n' < version.txt)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag_name }}" ]]; then
            tag="${{ github.event.inputs.tag_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            tag="v${base}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$base" >> "$GITHUB_OUTPUT"
          echo "Building godm Linux release $tag"

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev pkg-config

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Install Wails v3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build Application
        run: |
          wails3 build
          go build -trimpath -ldflags="-w -s" -o bin/godm-cli ./cmd/godm

      - name: Package Linux Assets
        run: |
          tag="${{ steps.ver.outputs.tag }}"
          mkdir -p artifacts dist_linux
          
          cp bin/godm dist_linux/
          cp bin/godm-cli dist_linux/
          cp -r extension dist_linux/
          [ -f README.md ] && cp README.md dist_linux/
          [ -f LICENSE ] && cp LICENSE dist_linux/
          [ -f build/appicon.png ] && cp build/appicon.png dist_linux/
          [ -f build/linux/desktop ] && cp build/linux/desktop dist_linux/godm.desktop
          
          tar -czvf "artifacts/godm-${tag}-linux-amd64.tar.gz" -C dist_linux .
          cp "artifacts/godm-${tag}-linux-amd64.tar.gz" "artifacts/godm-linux-amd64.tar.gz"
          cp bin/godm "artifacts/godm-linux-amd64"
          cp bin/godm-cli "artifacts/godm-cli-linux-amd64"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: artifacts/*

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-artifacts
          path: release_files

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-artifacts
          path: release_files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: godm ${{ needs.build-windows.outputs.tag }}
          draft: false
          prerelease: ${{ contains(needs.build-windows.outputs.tag, '-dev') || contains(needs.build-windows.outputs.tag, '-alpha') }}
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
